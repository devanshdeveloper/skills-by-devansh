# ==============================================================================
# SECURITY NOTICE: GITHUB PAGES CONFIDENTIALITY & REACHABILITY
# ==============================================================================
# When enabled on a public GitHub repository, GitHub Pages sites are publicly
# accessible over the internet to anyone with the URL.
# If your client review materials contain confidential branding, pre-release
# product information, or sensitive business notes:
#   1. DO NOT deploy this workflow on a public repository.
#   2. Use the local offline preview server instead:
#      `node skills/create-nww-website/scripts/client-review/preview.mjs`
#   3. If online client sharing is required for private assets, ensure the
#      repository is private and GitHub Enterprise "Private Pages" is enabled.
# ==============================================================================
name: Deploy Client Review to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'project-docs/client-review/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Client Review Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'project-docs/client-review'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
